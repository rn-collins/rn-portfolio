name: Render LinkedIn Films

on:
  workflow_dispatch:
    inputs:
      build_ids:
        description: 'Optional space-separated build IDs; empty renders every film spec'
        required: false
        type: string
  push:
    branches:
      - 'build-*'
      - 'workstream/build-*'
      - 'workstream/build-media-*'
    paths:
      - 'data/linkedin-film-specs-v1.json'
      - 'scripts/render-linkedin-films.py'
      - '.github/workflows/render-linkedin-films.yml'

concurrency:
  group: rn-linkedin-films-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Select and render films
        env:
          REQUESTED_BUILD_IDS: ${{ inputs.build_ids }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_BUILD_IDS:-}" ]; then
            read -r -a ids <<< "$REQUESTED_BUILD_IDS"
            python scripts/render-linkedin-films.py "${ids[@]}"
          else
            python scripts/render-linkedin-films.py
          fi
      - name: Verify generated public assets
        env:
          REQUESTED_BUILD_IDS: ${{ inputs.build_ids }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_BUILD_IDS:-}" ]; then
            read -r -a ids <<< "$REQUESTED_BUILD_IDS"
          else
            mapfile -t ids < <(python -c 'import json; print(*[b["id"] for b in json.load(open("data/linkedin-film-specs-v1.json"))["builds"]], sep="\n")')
          fi
          for id in "${ids[@]}"; do
            video="apps/web/public/media/builds/$id/build-$id-linkedin.mp4"
            poster="apps/web/public/media/builds/$id/build-$id-linkedin-poster.png"
            captions="apps/web/public/media/builds/$id/build-$id-linkedin-captions.vtt"
            transcript="apps/web/public/media/builds/$id/build-$id-linkedin-transcript.txt"
            test -s "$video"
            test -s "$poster"
            test -s "$captions"
            test -s "$transcript"
            grep -q "^WEBVTT" "$captions"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$video")" = "720"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$video")" = "900"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$video")" = "24/1"
            test -z "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video")"
          done
          python -m json.tool docs/builds/linkedin-media-manifest-v2.json >/dev/null
      - name: Commit regenerated media
        run: |
          git config user.name "rn-builds-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/media/builds docs/builds/linkedin-media-manifest-v2.json
          if git diff --cached --quiet; then
            echo "Media already matches the canonical specs."
            exit 0
          fi
          git commit -m "media: render canonical LinkedIn films [skip media]"
          git push
