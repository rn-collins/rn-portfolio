name: Render LinkedIn Films

on:
  workflow_dispatch:
  push:
    branches:
      - 'workstream/build-media-*'
    paths:
      - 'data/linkedin-film-specs-v1.json'
      - 'scripts/render-linkedin-films.py'
      - '.github/workflows/render-linkedin-films.yml'

concurrency:
  group: rn-linkedin-films-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render canonical 001-006 films
        run: python scripts/render-linkedin-films.py 001 002 003 004 005 006
      - name: Verify generated public assets
        run: |
          set -euo pipefail
          for id in 001 002 003 004 005 006; do
            test -s "apps/web/public/media/builds/$id/build-$id-linkedin.mp4"
            test -s "apps/web/public/media/builds/$id/build-$id-linkedin-poster.png"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -of default=nw=1 "apps/web/public/media/builds/$id/build-$id-linkedin.mp4"
          done
          python -m json.tool docs/builds/linkedin-media-manifest-v2.json >/dev/null
      - name: Commit regenerated media
        run: |
          git config user.name "rn-builds-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/media/builds docs/builds/linkedin-media-manifest-v2.json
          if git diff --cached --quiet; then
            echo "Media already matches the canonical specs."
            exit 0
          fi
          git commit -m "media: render canonical LinkedIn films 001-006 [skip media]"
          git push
