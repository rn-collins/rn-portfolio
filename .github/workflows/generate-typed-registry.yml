name: Generate typed 100 Builds registry
on:
  push:
    branches: ['feature/100-builds-platform-foundation']
    paths:
      - '.github/workflows/generate-typed-registry.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/100-builds-platform-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-typed-registry.mjs
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit generated registry and lockfile
        run: |
          git config user.name "RN Builds Bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/registry/src/registry.generated.ts pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: generate typed canonical 100-build registry"
          git push origin HEAD:feature/100-builds-platform-foundation
