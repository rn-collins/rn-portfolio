name: RN Builds Platform CI
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'playwright.config.ts'
      - '.github/workflows/platform-ci.yml'
  push:
    branches:
      - 'main'
      - 'feature/100-builds-platform-foundation'
      - 'workstream/build-*'
      - 'build-*'
concurrency:
  group: rn-builds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate:public-surface
      - run: pnpm validate:lineage
      - run: pnpm validate:canonical-lineage
      - run: pnpm validate:media
      - run: pnpm validate:archive-scaffold
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - run: pnpm test:e2e
