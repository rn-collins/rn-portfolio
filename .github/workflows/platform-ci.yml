name: RN Builds Platform CI
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'data/**'
      - 'docs/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'playwright.config.ts'
      - '.github/workflows/platform-ci.yml'
  push:
    branches:
      - 'feature/100-builds-platform-foundation'
      - 'workstream/build-*'
      - 'workstream/gallery-*'
concurrency:
  group: rn-builds-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm validate:lineage
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - name: Run Playwright certification
        id: e2e
        continue-on-error: true
        run: pnpm test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce Playwright gate
        if: steps.e2e.outcome == 'failure'
        run: exit 1
