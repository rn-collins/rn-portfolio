name: Extract and validate build registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - data/builds.json
      - scripts/extract_builds.py
      - .github/workflows/extract-builds.yml

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract or validate registry
        run: python scripts/extract_builds.py

      - name: Commit generated registry and loader
        run: |
          if git diff --quiet; then
            echo "Registry is already canonical."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/builds.json
          git commit -m "Extract build registry into structured data"
          git push
