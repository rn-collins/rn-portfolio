name: Generate platform pnpm lockfile
on:
  push:
    branches: ['feature/100-builds-platform-foundation']
    paths:
      - '.github/workflows/generate-platform-lock.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/100-builds-platform-foundation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile
        run: |
          git config user.name "RN Builds Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: add platform pnpm lockfile"
          git push origin HEAD:feature/100-builds-platform-foundation
