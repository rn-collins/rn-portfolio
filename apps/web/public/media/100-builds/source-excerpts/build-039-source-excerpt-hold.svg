<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 039 source excerpt review render</title><desc id="desc">Title, Recommendation status, and abstract of the official 30 April 2013 PROV-O Recommendation.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">PROV-O: The PROV Ontology</text><text x="84" y="171" class="gap">— noncontiguous excerpt —</text><text x="84" y="213" class="body">W3C Recommendation 30 April 2013</text><text x="84" y="267" class="gap">— noncontiguous excerpt —</text><text x="84" y="309" class="body">The PROV Ontology (PROV-O) expresses the</text><text x="84" y="343" class="body">PROV Data Model [PROV-DM] using the OWL2</text><text x="84" y="377" class="body">Web Ontology Language (OWL2)</text><text x="84" y="411" class="body">[OWL2-OVERVIEW]. It provides a set of</text><text x="84" y="445" class="body">classes, properties, and restrictions</text><text x="84" y="479" class="body">that can be used to represent and</text><text x="84" y="513" class="body">interchange provenance information</text><text x="84" y="547" class="body">generated in different systems and under</text><text x="84" y="581" class="body">different contexts. It can also be</text><text x="84" y="615" class="body">specialized to create new classes and</text><text x="84" y="649" class="body">properties to model provenance</text><text x="84" y="683" class="body">information for different applications</text><text x="84" y="717" class="body">and domains. The PROV Document Overview</text><text x="84" y="751" class="body">describes the overall state of PROV, and</text><text x="84" y="785" class="body">should be read before other PROV</text><text x="84" y="819" class="body">documents. The namespace for all PROV-O</text><text x="84" y="853" class="body">terms is http://www.w3.org/ns/prov#. The</text><text x="84" y="887" class="body">OWL encoding of the PROV Ontology is</text><text x="84" y="921" class="body">available here.</text><text x="84" y="1288" class="foot">Source: W3C PROV-O Recommendation</text><text x="84" y="1313" class="foot">https://www.w3.org/TR/2013/REC-prov-o-20130430/</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">W3C Software and Document License: https://www.w3.org/copyright/software-license-2023/</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>