<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 058 source excerpt review render</title><desc id="desc">PROV-O definitions for entities, activities, generation, and derivation relationships.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">PROV-O — Starting Point</text><text x="84" y="151" class="head">Terms</text><text x="84" y="217" class="gap">— noncontiguous excerpt —</text><text x="84" y="259" class="body">Entity: An prov:Entity is a physical,</text><text x="84" y="293" class="body">digital, conceptual, or other kind of</text><text x="84" y="327" class="body">thing with some fixed aspects; entities</text><text x="84" y="361" class="body">may be real or imaginary.</text><text x="84" y="415" class="gap">— noncontiguous excerpt —</text><text x="84" y="457" class="body">Activity: An prov:Activity is something</text><text x="84" y="491" class="body">that occurs over a period of time and</text><text x="84" y="525" class="body">acts upon or with entities; it may</text><text x="84" y="559" class="body">include consuming, processing,</text><text x="84" y="593" class="body">transforming, modifying, relocating,</text><text x="84" y="627" class="body">using, or generating entities.</text><text x="84" y="681" class="gap">— noncontiguous excerpt —</text><text x="84" y="723" class="body">wasGeneratedBy: Activities start and end</text><text x="84" y="757" class="body">at particular points in time (described</text><text x="84" y="791" class="body">using properties prov:startedAtTime and</text><text x="84" y="825" class="body">prov:endedAtTime, respectively) and</text><text x="84" y="859" class="body">during their lifespan can use and</text><text x="84" y="893" class="body">generate a variety of Entities</text><text x="84" y="927" class="body">(described with prov:used and</text><text x="84" y="961" class="body">prov:wasGeneratedBy, respectively).</text><text x="84" y="1015" class="gap">— noncontiguous excerpt —</text><text x="84" y="1057" class="body">wasDerivedFrom: Provenance chains</text><text x="84" y="1091" class="body">comprising only Entities can be formed</text><text x="84" y="1125" class="body">using the prov:wasDerivedFrom property.</text><text x="84" y="1159" class="body">A derivation is a transformation of one</text><text x="616" y="105" class="body">entity into another.</text><text x="84" y="1288" class="foot">Source: W3C PROV-O Recommendation</text><text x="84" y="1313" class="foot">https://www.w3.org/TR/2013/REC-prov-o-20130430/</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">W3C Software and Document License: https://www.w3.org/copyright/software-license-2023/</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>