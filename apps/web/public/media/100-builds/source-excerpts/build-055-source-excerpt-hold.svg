<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 055 source excerpt review render</title><desc id="desc">NISTIR 8259A excerpt describing IoT cybersecurity state awareness.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">NISTIR 8259A —</text><text x="84" y="151" class="head">Cybersecurity State</text><text x="84" y="197" class="head">Awareness</text><text x="84" y="263" class="body">Capability: The IoT device can report on</text><text x="84" y="297" class="body">its cybersecurity state and make that</text><text x="84" y="331" class="body">information accessible to authorized</text><text x="84" y="365" class="body">entities only.</text><text x="84" y="419" class="body">Common Elements: 1. The ability to</text><text x="84" y="453" class="body">report the device’s cybersecurity state.</text><text x="84" y="487" class="body">2. The ability to differentiate between</text><text x="84" y="521" class="body">when a device will likely operate as</text><text x="84" y="555" class="body">expected from when it may be in a</text><text x="84" y="589" class="body">degraded cybersecurity state. 3. The</text><text x="84" y="623" class="body">ability to restrict access to the state</text><text x="84" y="657" class="body">indicator so only authorized entities</text><text x="84" y="691" class="body">can view it. 4. The ability to prevent</text><text x="84" y="725" class="body">any entities (authorized or</text><text x="84" y="759" class="body">unauthorized) from editing the state</text><text x="84" y="793" class="body">except for those entities that are</text><text x="84" y="827" class="body">responsible for maintaining the device’s</text><text x="84" y="861" class="body">state information. 5. The ability to</text><text x="84" y="895" class="body">make the state information available to</text><text x="84" y="929" class="body">a service on another device, such as an</text><text x="84" y="963" class="body">event/state log server.</text><text x="84" y="1288" class="foot">Source: NISTIR 8259A</text><text x="84" y="1313" class="foot">https://nvlpubs.nist.gov/nistpubs/ir/2020/NIST.IR.8259A.pdf</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">NIST work excerpt; see source publication notices and policies: https://www.nist.gov/open</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>