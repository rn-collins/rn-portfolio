<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 036 source excerpt review render</title><desc id="desc">Sequential text excerpt containing the title, 19 November 2019 Candidate Recommendation status, and offline-capability motivation passage from Service Workers 1.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 50px Arial,sans-serif;fill:#111}.body{font:40px Arial,sans-serif;fill:#1f2933}.note{font:italic 40px Arial,sans-serif;fill:#7c2d12}.foot{font:32px Arial,sans-serif;fill:#374151}</style><text x="84" y="112" class="head">Service Workers 1</text><text x="84" y="192" class="body">W3C Candidate Recommendation, 19 November 2019</text><text x="84" y="264" class="body">The service worker is designed first to redress</text><text x="84" y="314" class="body">the balance between Web applications and native</text><text x="84" y="364" class="body">applications’ offline capabilities, and running</text><text x="84" y="414" class="body">background code to process events like push</text><text x="84" y="464" class="body">messages, even while offline.</text><text x="84" y="1190" class="foot">Source: Service Workers 1 — 2019 Candidate Recommendation</text><text x="84" y="1232" class="foot">https://www.w3.org/TR/2019/CR-service-workers-1-20191119/</text><text x="84" y="1274" class="foot">Copyright © 2019 W3C®. Excerpt subject to the snapshot’s W3C</text><text x="84" y="1316" class="foot">Software and Document License notice.</text><text x="84" y="1358" class="foot">Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1400" class="foot">APPROVED · SOURCE CONTEXT · SELECTED AND STAGED</text></svg>