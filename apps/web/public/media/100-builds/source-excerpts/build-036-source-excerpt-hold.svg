<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 036 source excerpt review render</title><desc id="desc">Title, Candidate Recommendation status, abstract, and offline-capability motivation from the 19 November 2019 Service Workers 1 snapshot.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">Service Workers 1</text><text x="84" y="171" class="gap">— noncontiguous excerpt —</text><text x="84" y="213" class="body">W3C Candidate Recommendation, 19</text><text x="84" y="247" class="body">November 2019</text><text x="84" y="301" class="gap">— noncontiguous excerpt —</text><text x="84" y="343" class="body">Abstract This specification describes a</text><text x="84" y="377" class="body">method that enables applications to take</text><text x="84" y="411" class="body">advantage of persistent background</text><text x="84" y="445" class="body">processing, including hooks to enable</text><text x="84" y="479" class="body">bootstrapping of web applications while</text><text x="84" y="513" class="body">offline. The core of this system is an</text><text x="84" y="547" class="body">event-driven Web Worker, which responds</text><text x="84" y="581" class="body">to events dispatched from documents and</text><text x="84" y="615" class="body">other sources. A system for managing</text><text x="84" y="649" class="body">installation, versions, and upgrades is</text><text x="84" y="683" class="body">provided. The service worker is a</text><text x="84" y="717" class="body">generic entry point for event-driven</text><text x="84" y="751" class="body">background processing in the Web</text><text x="84" y="785" class="body">Platform that is extensible by other</text><text x="84" y="819" class="body">specifications.</text><text x="84" y="873" class="gap">— noncontiguous excerpt —</text><text x="84" y="915" class="body">1. Motivations</text><text x="84" y="969" class="gap">— noncontiguous excerpt —</text><text x="84" y="1011" class="body">The service worker is designed first to</text><text x="84" y="1045" class="body">redress the balance between Web</text><text x="84" y="1079" class="body">applications and native applications’</text><text x="84" y="1113" class="body">offline capabilities, and running</text><text x="84" y="1147" class="body">background code to process events like</text><text x="616" y="105" class="body">push messages, even while offline.</text><text x="84" y="1288" class="foot">Source: Service Workers 1 — 2019 Candidate Recommendation</text><text x="84" y="1313" class="foot">https://www.w3.org/TR/2019/CR-service-workers-1-20191119/</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">W3C Software and Document License: https://www.w3.org/copyright/software-license-2023/</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>