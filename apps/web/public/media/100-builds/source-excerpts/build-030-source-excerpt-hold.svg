<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 030 source excerpt review render</title><desc id="desc">Title, Recommendation status, abstract, and four accessibility principles from WCAG 2.2.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">Web Content Accessibility</text><text x="84" y="151" class="head">Guidelines (WCAG) 2.2</text><text x="84" y="217" class="gap">— noncontiguous excerpt —</text><text x="84" y="259" class="body">W3C Recommendation 05 October 2023</text><text x="84" y="313" class="gap">— noncontiguous excerpt —</text><text x="84" y="355" class="body">Web Content Accessibility Guidelines</text><text x="84" y="389" class="body">(WCAG) 2.2 covers a wide range of</text><text x="84" y="423" class="body">recommendations for making Web content</text><text x="84" y="457" class="body">more accessible. Following these</text><text x="84" y="491" class="body">guidelines will make content more</text><text x="84" y="525" class="body">accessible to a wider range of people</text><text x="84" y="559" class="body">with disabilities, including</text><text x="84" y="593" class="body">accommodations for blindness and low</text><text x="84" y="627" class="body">vision, deafness and hearing loss,</text><text x="84" y="661" class="body">limited movement, speech disabilities,</text><text x="84" y="695" class="body">photosensitivity, and combinations of</text><text x="84" y="729" class="body">these, and some accommodation for</text><text x="84" y="763" class="body">learning disabilities and cognitive</text><text x="84" y="797" class="body">limitations; but will not address every</text><text x="84" y="831" class="body">user need for people with these</text><text x="84" y="865" class="body">disabilities. These guidelines address</text><text x="84" y="899" class="body">accessibility of web content on</text><text x="84" y="933" class="body">desktops, laptops, tablets, and mobile</text><text x="84" y="967" class="body">devices. Following these guidelines will</text><text x="84" y="1001" class="body">also often make Web content more usable</text><text x="84" y="1035" class="body">to users in general. WCAG 2.2 success</text><text x="84" y="1069" class="body">criteria are written as testable</text><text x="84" y="1103" class="body">statements that are not</text><text x="84" y="1137" class="body">technology-specific. Guidance about</text><text x="84" y="1171" class="body">satisfying the success criteria in</text><text x="616" y="105" class="body">specific technologies, as well as</text><text x="616" y="139" class="body">general information about interpreting</text><text x="616" y="173" class="body">the success criteria, is provided in</text><text x="616" y="207" class="body">separate documents. See Web Content</text><text x="616" y="241" class="body">Accessibility Guidelines (WCAG) Overview</text><text x="616" y="275" class="body">for an introduction and links to WCAG</text><text x="616" y="309" class="body">technical and educational material. WCAG</text><text x="616" y="343" class="body">2.2 extends Web Content Accessibility</text><text x="616" y="377" class="body">Guidelines 2.1 [WCAG21], which was</text><text x="616" y="411" class="body">published as a W3C Recommendation June</text><text x="616" y="445" class="body">2018. Content that conforms to WCAG 2.2</text><text x="616" y="479" class="body">also conforms to WCAG 2.0 and WCAG 2.1.</text><text x="616" y="513" class="body">The WG intends that for policies</text><text x="616" y="547" class="body">requiring conformance to WCAG 2.0 or</text><text x="616" y="581" class="body">WCAG 2.1, WCAG 2.2 can provide an</text><text x="616" y="615" class="body">alternate means of conformance. The</text><text x="616" y="649" class="body">publication of WCAG 2.2 does not</text><text x="616" y="683" class="body">deprecate or supersede WCAG 2.0 or WCAG</text><text x="616" y="717" class="body">2.1. While WCAG 2.0 and WCAG 2.1 remain</text><text x="616" y="751" class="body">W3C Recommendations, the W3C advises the</text><text x="616" y="785" class="body">use of WCAG 2.2 to maximize future</text><text x="616" y="819" class="body">applicability of accessibility efforts.</text><text x="616" y="853" class="body">The W3C also encourages use of the most</text><text x="616" y="887" class="body">current version of WCAG when developing</text><text x="616" y="921" class="body">or updating Web accessibility policies.</text><text x="616" y="975" class="gap">— noncontiguous excerpt —</text><text x="616" y="1017" class="body">Principles — At the top are four</text><text x="616" y="1051" class="body">principles that provide the foundation</text><text x="616" y="1085" class="body">for Web accessibility: perceivable,</text><text x="616" y="1119" class="body">operable, understandable, and robust.</text><text x="84" y="1288" class="foot">Source: WCAG 2.2 immutable 2023 Recommendation</text><text x="84" y="1313" class="foot">https://www.w3.org/TR/2023/REC-WCAG22-20231005/</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">W3C Software and Document License: https://www.w3.org/copyright/software-license-2023/</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>