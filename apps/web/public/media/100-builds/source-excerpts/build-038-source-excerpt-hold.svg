<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 038 source excerpt review render</title><desc id="desc">Excerpt from NIST AI RMF 1.0 describing its voluntary, use-case-agnostic risk-management approach.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">NIST Artificial</text><text x="84" y="151" class="head">Intelligence Risk</text><text x="84" y="197" class="head">Management Framework (AI</text><text x="84" y="243" class="head">RMF 1.0)</text><text x="84" y="309" class="body">As directed by the National Artificial</text><text x="84" y="343" class="body">Intelligence Initiative Act of 2020</text><text x="84" y="377" class="body">(P.L. 116-283), the goal of the AI RMF</text><text x="84" y="411" class="body">is to offer a resource to the</text><text x="84" y="445" class="body">organizations designing, developing,</text><text x="84" y="479" class="body">deploying, or using AI systems to help</text><text x="84" y="513" class="body">manage the many risks of AI and promote</text><text x="84" y="547" class="body">trustworthy and responsible development</text><text x="84" y="581" class="body">and use of AI systems. The Framework is</text><text x="84" y="615" class="body">intended to be voluntary,</text><text x="84" y="649" class="body">rights-preserving, non-sector-specific,</text><text x="84" y="683" class="body">and use-case agnostic, providing</text><text x="84" y="717" class="body">flexibility to organizations of all</text><text x="84" y="751" class="body">sizes and in all sectors and throughout</text><text x="84" y="785" class="body">society to implement the approaches in</text><text x="84" y="819" class="body">the Framework.</text><text x="84" y="1288" class="foot">Source: NIST AI RMF 1.0</text><text x="84" y="1313" class="foot">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">NIST work excerpt; see source publication notices and policies: https://www.nist.gov/open</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>