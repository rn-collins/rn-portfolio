<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 041 source excerpt review render</title><desc id="desc">NIST AI RMF GOVERN excerpt describing accountability structures, roles, and responsibilities.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">NIST AI RMF 1.0 — GOVERN 2</text><text x="84" y="171" class="body">GOVERN 2: Accountability structures are</text><text x="84" y="205" class="body">in place so that the appropriate teams</text><text x="84" y="239" class="body">and individuals are empowered,</text><text x="84" y="273" class="body">responsible, and trained for mapping,</text><text x="84" y="307" class="body">measuring, and managing AI risks.</text><text x="84" y="361" class="body">GOVERN 2.1: Roles and responsibilities</text><text x="84" y="395" class="body">and lines of communication related to</text><text x="84" y="429" class="body">mapping, measuring, and managing AI</text><text x="84" y="463" class="body">risks are documented and are clear to</text><text x="84" y="497" class="body">individuals and teams throughout the</text><text x="84" y="531" class="body">organization.</text><text x="84" y="585" class="body">GOVERN 2.2: The organization’s personnel</text><text x="84" y="619" class="body">and partners receive AI risk management</text><text x="84" y="653" class="body">training to enable them to perform their</text><text x="84" y="687" class="body">duties and responsibilities consistent</text><text x="84" y="721" class="body">with related policies, procedures, and</text><text x="84" y="755" class="body">agreements.</text><text x="84" y="809" class="body">GOVERN 2.3: Executive leadership of the</text><text x="84" y="843" class="body">organization takes responsibility for</text><text x="84" y="877" class="body">decisions about risks associated with AI</text><text x="84" y="911" class="body">system development and deployment.</text><text x="84" y="1288" class="foot">Source: NIST AI RMF 1.0</text><text x="84" y="1313" class="foot">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">NIST work excerpt; see source publication notices and policies: https://www.nist.gov/open</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>