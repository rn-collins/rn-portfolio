<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 040 source excerpt review render</title><desc id="desc">NIST AI RMF excerpt explaining that trustworthiness characteristics are interrelated and involve tradeoffs.</desc><rect width="1200" height="1500" fill="#f7f4ed"/><rect x="48" y="48" width="1104" height="1404" rx="20" fill="#fff" stroke="#222" stroke-width="3"/><style>.head{font:700 38px Arial,sans-serif;fill:#111}.body{font:24px Arial,sans-serif;fill:#1f2933}.gap{font:italic 20px Arial,sans-serif;fill:#7c2d12}.foot{font:18px Arial,sans-serif;fill:#374151}</style><text x="84" y="105" class="head">NIST Artificial</text><text x="84" y="151" class="head">Intelligence Risk</text><text x="84" y="197" class="head">Management Framework (AI</text><text x="84" y="243" class="head">RMF 1.0)</text><text x="84" y="309" class="body">Trustworthiness characteristics</text><text x="84" y="343" class="body">explained in this document influence</text><text x="84" y="377" class="body">each other. Highly secure but unfair</text><text x="84" y="411" class="body">systems, accurate but opaque and</text><text x="84" y="445" class="body">uninterpretable systems, and inaccurate</text><text x="84" y="479" class="body">but secure, privacy-enhanced, and</text><text x="84" y="513" class="body">transparent systems are all undesirable.</text><text x="84" y="547" class="body">A comprehensive approach to risk</text><text x="84" y="581" class="body">management calls for balancing tradeoffs</text><text x="84" y="615" class="body">among the trustworthiness</text><text x="84" y="649" class="body">characteristics. It is the joint</text><text x="84" y="683" class="body">responsibility of all AI actors to</text><text x="84" y="717" class="body">determine whether AI technology is an</text><text x="84" y="751" class="body">appropriate or necessary tool for a</text><text x="84" y="785" class="body">given context or purpose, and how to use</text><text x="84" y="819" class="body">it responsibly. The decision to</text><text x="84" y="853" class="body">commission or deploy an AI system should</text><text x="84" y="887" class="body">be based on a contextual assessment of</text><text x="84" y="921" class="body">trustworthiness characteristics and the</text><text x="84" y="955" class="body">relative risks, impacts, costs, and</text><text x="84" y="989" class="body">benefits, and informed by a broad set of</text><text x="84" y="1023" class="body">interested parties.</text><text x="84" y="1288" class="foot">Source: NIST AI RMF 1.0</text><text x="84" y="1313" class="foot">https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf</text><text x="84" y="1338" class="foot">Accessed 2026-08-27 · Context excerpt only · No affiliation or endorsement.</text><text x="84" y="1363" class="foot">NIST work excerpt; see source publication notices and policies: https://www.nist.gov/open</text><text x="84" y="1388" class="foot">HOLD · REVIEW RENDER · NOT SELECTED OR STAGED</text></svg>