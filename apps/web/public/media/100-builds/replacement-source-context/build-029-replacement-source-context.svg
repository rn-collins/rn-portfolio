<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
<title id="title">Build 029: Consequence Propagation — official-source context candidate</title>
<desc id="desc">Official W3C PROV Primer summary describing error checking, tracing responsible parties, regenerating datasets, relating document versions, and inspecting sources and attribution. Review candidate only; not evidence of prototype performance or institutional endorsement.</desc>
<rect width="1200" height="1500" fill="#F6F1E7"/><rect x="46" y="46" width="1108" height="1408" rx="22" fill="#FFFDF8" stroke="#172126" stroke-width="4"/>
<rect x="46" y="46" width="1108" height="118" rx="22" fill="#172126"/><text x="94" y="119" class="eyebrow" fill="#FFFDF8">OFFICIAL SOURCE CONTEXT · REVIEW CANDIDATE</text>
<text x="94" y="220" class="kicker">BUILD 029</text><text x="94" y="278" class="title">Consequence Propagation</text>
<line x1="94" y1="300" x2="1106" y2="300" stroke="#D46B42" stroke-width="8"/>
<text x="96" y="330" class="quote">PROVENANCE ENABLES</text>

<text x="96" y="403" class="quote">checking for possible errors</text>
<text x="96" y="453" class="quote">tracking down parties responsible for fixing them</text>
<text x="96" y="503" class="quote">repeating processes to re-generate datasets</text>
<text x="96" y="553" class="quote">relating versions of documents over time</text>
<text x="96" y="603" class="quote">inspecting sources and attribution</text>
<rect x="78" y="1010" width="1044" height="165" rx="16" fill="#E8F0EE"/><text x="104" y="1052" class="label">WHY THIS FITS</text>
<text x="104" y="1094" class="small">W3C PROV Primer: provenance supports error checking, responsibility tracing, process</text>
<text x="104" y="1128" class="small">repetition, version relationships, sources and attribution.</text>
<rect x="78" y="1195" width="1044" height="178" rx="16" fill="#F6E7DF"/><text x="104" y="1237" class="label">CLAIM LIMIT</text>
<text x="104" y="1279" class="fine">Supports tracing how outputs, versions, responsible parties and sources relate; it does not</text>
<text x="104" y="1311" class="fine">demonstrate Build 029&#8217;s propagation logic or imply W3C endorsement.</text>
<text x="94" y="1410" class="source">W3C PROV MODEL PRIMER · §4 SUMMARY</text><text x="1106" y="1410" text-anchor="end" class="source">NO LOGO · NO ENDORSEMENT</text>
