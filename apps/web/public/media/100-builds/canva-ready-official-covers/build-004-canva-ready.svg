<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Build 004 production official-context variant</title><desc id="desc">Build 004, Before the Automation. Official NIST AI RMF Playbook document or guidance page, selected as contextual evidence for Build 004, Before the Automation.</desc><rect width="1200" height="1500" fill="#f5f1e8"/><rect x="36" y="36" width="1128" height="1428" rx="20" fill="white" stroke="#111827" stroke-width="4"/><style>.h{font:800 48px Arial;fill:#111827}.e{font:700 25px Arial;fill:#92400e;letter-spacing:2px}.s{font:700 43px Arial;fill:#111827}.b{font:35px Arial;fill:#1f2937}.f{font:27px Arial;fill:#374151}.u{font:23px Arial;fill:#1d4ed8}.x{font:700 24px Arial;fill:#92400e}</style><text x="72" y="110" class="h">A PILE OF SOURCES IS NOT</text><text x="72" y="170" class="h">INTELLIGENCE. The transformation</text><text x="72" y="230" class="h">happens through explicit gates.</text><text x="72" y="345" class="e">OFFICIAL SOURCE EXCERPT · BUILD 004</text><text x="72" y="415" class="s">NIST AI RMF Playbook</text><text x="72" y="490" class="b">The Playbook suggests ways to navigate and use the</text><text x="72" y="536" class="b">AI Risk Management Framework to incorporate</text><text x="72" y="582" class="b">trustworthiness considerations.</text><text x="72" y="1170" class="f">The official NIST AI RMF Playbook, shown as automation-governance context.</text><text x="72" y="1220" class="f">Context only; not proof of performance, compliance, safety, or endorsement.</text><text x="72" y="1270" class="u">https://www.nist.gov/itl/ai-risk-management-framework/nist-ai-rmf-playbook</text><text x="72" y="1340" class="f">Official NIST public information · Republished courtesy of NIST</text><text x="72" y="1430" class="x">OFFICIAL CONTEXT · SOURCE-ATTRIBUTED · NO ENDORSEMENT</text></svg>