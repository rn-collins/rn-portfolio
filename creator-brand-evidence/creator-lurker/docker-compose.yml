# Local dev stack for Creator Lurker v1: Postgres(+pgvector), n8n, Ollama.
# Bring up with: docker compose up -d   (then load db/schema.sql)
version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lurker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lurker}
      POSTGRES_DB: ${POSTGRES_DB:-creator_lurker}
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-creator_lurker}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-lurker}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-lurker}
    ports: ["5678:5678"]
    depends_on: [db]
    volumes:
      - n8n_data:/home/node/.n8n

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  db_data:
  n8n_data:
  ollama_data:
