<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build — 100 Builds</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Mono&family=Manrope:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet"><style>:root{--teal:#1B7A68;--bg:#F6F3EC;--surface:#fff;--ink:#2A3D35;--muted:#5C6B63;--border:#D9D4CA}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif}.top{background:var(--ink);padding:1rem 2rem;border-bottom:2px solid var(--teal)}.top a{color:#8eb5a7;text-decoration:none;font:12px DM Mono,monospace;letter-spacing:.1em;text-transform:uppercase}.wrap{max-width:1000px;margin:auto;padding:5rem 2rem 8rem}.kicker{font:11px DM Mono,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}h1{font:500 clamp(3rem,8vw,6rem)/.95 Cormorant Garamond,serif;margin:1rem 0}.dek{font:500 1.3rem/1.55 Cormorant Garamond,serif;max-width:760px}.meta{display:flex;gap:.5rem;flex-wrap:wrap;margin:2rem 0 4rem}.pill{border:1px solid var(--border);padding:.45rem .65rem;font:10px DM Mono,monospace;text-transform:uppercase}.pair{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:3rem 0}.artifact{background:var(--ink);color:#fff;padding:2rem;min-height:260px;display:flex;flex-direction:column}.artifact b{font:11px DM Mono,monospace;color:#63b39f;letter-spacing:.12em}.artifact h2{font:500 2rem Cormorant Garamond,serif}.artifact p{color:#a7bbb3;line-height:1.7;font-size:.85rem}.artifact a{margin-top:auto;color:#fff;font:11px DM Mono,monospace;text-transform:uppercase}.section{border-top:1px solid var(--border);padding:2.5rem 0;display:grid;grid-template-columns:220px 1fr;gap:2rem}.section h2{font:500 2rem Cormorant Garamond,serif;margin:0}.section p,.section li{color:var(--muted);line-height:1.8}.lineage{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.box{background:var(--surface);border:1px solid var(--border);padding:1.2rem}.box h3{font:11px DM Mono,monospace;color:var(--teal);text-transform:uppercase}.box ul{padding-left:1rem}@media(max-width:700px){.pair,.section,.lineage{grid-template-columns:1fr}}</style></head><body><header class="top"><a href="/100-builds.html">← 100 Builds exhibition</a></header><main class="wrap" id="page"></main><script src="/data/100-builds.js"></script><script>const id=new URLSearchParams(location.search).get('id')||'001';const b=RN100_BUILDS.find(x=>x.id===id);const page=document.getElementById('page');const list=a=>a&&a.length?'<ul>'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'<p>None yet.</p>';if(!b){page.innerHTML='<div class="kicker">Unknown build</div><h1>Build not found</h1>'}else{document.title=`${b.title} — Build ${b.id} / 100`;page.innerHTML=`<div class="kicker">Build ${b.id} / 100 · Phase ${String(b.phase).padStart(2,'0')} · ${b.phaseName}</div><h1>${b.title}</h1><p class="dek">${b.description}</p><div class="meta"><span class="pill">${b.status}</span><span class="pill">Complexity ${b.complexity}/10</span><span class="pill">${b.artifactType}</span><span class="pill">v${b.version}</span></div><div class="pair"><article class="artifact"><b>A — FUNCTIONAL BUILD</b><h2>${b.title}</h2><p>${b.functional.summary||''}</p>${b.functional.url?`<a href="${b.functional.url}">Open build →</a>`:'<span>Planned</span>'}</article><article class="artifact"><b>B — VISUAL BUILD</b><h2>${b.visual.title||'Paired visual build'}</h2><p>${b.visual.concept||''}</p>${b.visual.url?`<a href="${b.visual.url}">Open visual →</a>`:'<span>Planned</span>'}</article></div><section class="section"><h2>The missing system</h2><p>${b.missingSystem||b.description}</p></section><section class="section"><h2>Infrastructure lineage</h2><div class="lineage"><div class="box"><h3>Uses</h3>${list(b.usesInfrastructure)}</div><div class="box"><h3>Creates</h3>${list(b.createsInfrastructure)}</div></div></section><section class="section"><h2>Limitations</h2><div>${list(b.limitations)}</div></section>`}</script></body></html>
